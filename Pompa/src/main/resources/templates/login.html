    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie / Rejestracja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {},
            plugins: [require('daisyui')],
        };
    </script>

</head>
<body class="bg-black-50">
<div class="absolute top-4 left-4">
    <a th:href="@{/}" class="btn btn-ghost btn-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
    </a>
</div>
<div class="min-h-screen flex items-center justify-center">

    <div class="card bg-base-100 shadow-xl p-6 max-w-md w-full">
        <div class="tabs">

            <a class="tab tab-bordered tab-active">Logowanie</a>
        </div>

        <!-- Login Form -->
        <div class="mt-6">
            <h2 class="text-2xl font-bold text-center mb-4">Zaloguj się</h2>
            <form th:action="@{/login}" method="post">
                <div class="form-control mb-4">
                    <label class="label">
                        <span class="label-text">Login</span>
                    </label>
                    <input type="text" name="username" placeholder="Podaj adres email" class="input input-bordered w-full" required />
                </div>
                <div class="form-control mb-6">
                    <label class="label">
                        <span class="label-text">Hasło</span>
                    </label>
                    <input type="password" name="password" placeholder="Podaj hasło" class="input input-bordered w-full" required />
                </div>
                <section class="grid grid-cols-2 md:grid-cols-1 gap-10 my-10 ">
                    <div class="form-control">
                        <label class="label cursor-pointer">
                            <span class="label-text">Zapamiętaj mnie!</span>
                            <input type="checkbox" class="toggle toggle-secondary" checked="false" />
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary w-full">Zaloguj</button>
<!--                    zmienić?-->
                    <a class="btn btn-primary w-full" th:href="@{/register}"> Przejdź do rejestracji</a>
                </section>
            </form>
        </div>
