<!DOCTYPE html>
<html data-theme="dark" lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie / Rejestracja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {},
            plugins: [require('daisyui')],
        };
    </script>
</head>
<body class="bg-black-50">
<div class="absolute top-4 left-4">
    <a th:href="@{/}" class="btn btn-ghost btn-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
    </a>
</div>
<div class="min-h-screen flex items-center justify-center">
    <div class="card bg-base-100 shadow-xl p-6 max-w-md w-full">
        <div class="tabs">
            <a class="tab tab-bordered tab-active">rejestracja</a>
        </div>

        <!-- Login Form -->
        <div class="mt-6">
            <h2 class="text-2xl font-bold text-center mb-4">Zarejestruj się</h2>
            <form>
                <div class="form-control mb-4">
                    <label class="label">
                        <span class="label-text">Adres Email</span>
                    </label>
                    <input type="email" placeholder="Podaj adres email" class="input input-bordered w-full" required />
                </div>
                <div class="form-control mb-6">
                    <label class="label">
                        <span class="label-text">Hasło</span>
                    </label>
                    <input type="password" placeholder="Podaj silne hasło" class="input input-bordered w-full" required />
                </div>
                <div class="form-control mb-6">
                    <label class="label">
                        <span class="label-text">Powtórz hasło</span>
                    </label>
                    <input type="password" placeholder="Podaj ponownie silne hasło" class="input input-bordered w-full" required />
                </div>
                <div>
                    <label class="label">
                        <span class="label-text">Podaj datę urodzin</span>
                    </label>
                    <input type="date" class="input input-bordered w-full focus:bg-base-100 focus:border-primary" />
                </div>

                <section class="grid grid-cols-2 md:grid-cols-1 gap-10 my-10 ">
                    <button type="submit" class="btn btn-primary w-full">Zarejestruj</button>
                    <a class="btn btn-primary w-full" th:href="@{/login}"> Przejdź do logowania</a>
                </section>
            </form>
        </div>
    </div>
</div>
</body>
</html>
